<!DOCTYPE html>
<html>
<head>
    <title>AR Min Nijo (Multi-Language Fixed)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: transparent !important;
            touch-action: none; user-select: none; -webkit-user-select: none;
            font-family: sans-serif;
        }
        .a-canvas {
            background-color: transparent !important;
            display: block !important;
            z-index: 10 !important;
        }
        #arjs-video {
            z-index: 1 !important; position: fixed !important;
            top: 0; left: 0; width: 100%; height: 100%;
            display: block !important; object-fit: cover !important;
        }
        
        #launcher {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #lang-container {
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
        }
        .lang-btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .lang-btn.active {
            background: #00FF00;
            color: black;
            border-color: #00FF00;
            font-weight: bold;
        }

        #launch-btn {
            padding: 20px 50px; font-size: 20px; font-weight: bold; color: white;
            background: blue; border: none; border-radius: 50px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        /* UIボタンのz-indexを明示的に最前面へ */
        #reset-btn {
            position: fixed; 
            top: 20px; 
            right: 20px;
            z-index: 99999; 
            padding: 10px 30px;
            background: rgba(0, 122, 255, 0.9);
            color: white; border: 2px solid white; border-radius: 40px;
            font-size: 16px; font-weight: bold; cursor: pointer; display: none;
            -webkit-tap-highlight-color: transparent;
        }

        #fix-bg-btn {
            position: fixed; 
            top: 80px;
            right: 20px; 
            z-index: 99999;
            padding: 10px; background: rgba(0,0,0,0.5); color: #ccc;
            border: 1px solid #888; border-radius: 8px; font-size: 12px; display: none;
        }

        #shutter-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 99999; padding: 15px 50px; 
            background: rgba(255, 60, 90, 0.9);
            color: white; border: 3px solid white; border-radius: 50px;
            font-size: 20px; font-weight: bold; cursor: pointer; display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }
        
        #status-text {
            position: fixed; top: 10px; left: 10px; width: 300px;
            color: #00FF00; font-weight: bold; font-size: 14px;
            text-shadow: 1px 1px 2px black; pointer-events: none; z-index: 9000;
            white-space: pre-wrap;
            background: rgba(0,0,0,0.6);
            padding: 5px; border-radius: 5px;
        }
    </style>

    <script>
        window.isARStarted = false;
        let currentLang = 'ja'; 

        const translations = {
            ja: {
                start: "カメラ起動",
                starting: "起動中...",
                reset: "リセット",
                shutter: "撮影",
                fixBg: "背景固定",
                permissionTitle: "ARを利用するにはセンサーの許可が必要です。\nページをリロードして再度試してください。",
                permissionError: "権限エラー: ",
                photoSaved: "写真を保存しました！",
                grabbed: "掴みました！",
                init: "初期化中...",
                permissionDenied: "センサー権限: 拒否",
                permissionGranted: "センサー権限: 許可",
                nonIOS: "iOS13+以外を検出"
            },
            en: {
                start: "START CAMERA",
                starting: "Starting...",
                reset: "RESET",
                shutter: "TAKE PHOTO",
                fixBg: "Fix BG",
                permissionTitle: "Sensor permission is required for AR.\nPlease reload and try again.",
                permissionError: "Permission Error: ",
                photoSaved: "Photo saved!",
                grabbed: "Grabbed!",
                init: "Initializing...",
                permissionDenied: "Sensor Permission: Denied",
                permissionGranted: "Sensor Permission: Granted",
                nonIOS: "Non-iOS 13+ device detected."
            },
            zh: {
                start: "启动相机",
                starting: "启动中...",
                reset: "重置",
                shutter: "拍照",
                fixBg: "固定背景",
                permissionTitle: "AR需要传感器权限。\n请刷新页面重试。",
                permissionError: "权限错误: ",
                photoSaved: "照片已保存！",
                grabbed: "已抓取！",
                init: "正在初始化...",
                permissionDenied: "传感器权限: 拒绝",
                permissionGranted: "传感器权限: 允许",
                nonIOS: "检测到非iOS 13+设备"
            },
            ko: {
                start: "카메라 시작",
                starting: "시작 중...",
                reset: "초기화",
                shutter: "사진 촬영",
                fixBg: "배경 고정",
                permissionTitle: "AR을 사용하려면 센서 권한이 필요합니다.\n페이지를 새로고침하여 다시 시도해주세요.",
                permissionError: "권한 오류: ",
                photoSaved: "사진이 저장되었습니다!",
                grabbed: "잡았습니다!",
                init: "초기화 중...",
                permissionDenied: "센서 권한: 거부됨",
                permissionGranted: "센서 권한: 허용됨",
                nonIOS: "iOS 13+ 이외의 기기 감지"
            }
        };

        function log(msg) {
            const el = document.getElementById('status-text');
            if(el) el.innerText = msg + "\n" + el.innerText.split("\n").slice(0, 4).join("\n");
            console.log(msg);
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('launch-btn').innerText = t.start;
            document.getElementById('reset-btn').innerText = t.reset;
            document.getElementById('shutter-btn').innerText = t.shutter;
            document.getElementById('fix-bg-btn').innerText = t.fixBg;
            
            if(!window.isARStarted) {
                document.getElementById('status-text').innerText = t.init;
            }

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('btn-' + lang).classList.add('active');
        }

        function startCamera() {
            const t = translations[currentLang];
            const runAR = () => {
                document.getElementById('launch-btn').innerText = t.starting;
                setTimeout(() => {
                    document.getElementById('launcher').style.display = 'none';
                    document.getElementById('reset-btn').style.display = 'block';
                    document.getElementById('fix-bg-btn').style.display = 'block';
                    document.getElementById('shutter-btn').style.display = 'block';
                    
                    const scene = document.querySelector('a-scene');
                    if(scene) scene.play();
                    
                    window.isARStarted = true;
                    setTimeout(resetPositions, 1000);
                }, 500);
            };

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            log(t.permissionGranted);
                            runAR();
                        } else {
                            alert(t.permissionTitle);
                            log(t.permissionDenied);
                        }
                    })
                    .catch(e => {
                        console.error(e);
                        alert(t.permissionError + e);
                    });
            } else {
                log(t.nonIOS);
                runAR();
            }
        }

        function takePhoto() {
            const scene = document.querySelector('a-scene');
            if (scene.components['photo-capture']) {
                scene.components['photo-capture'].requestCapture();
            } else {
                log("Photo capture component not ready.");
            }
        }

        function resetPositions() {
            const camera = document.querySelector('[camera]');
            const nijo = document.getElementById('wrapper-nijo');
            
            if(!camera || !nijo) return;

            const cameraPos = camera.object3D.position;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.object3D.quaternion).multiplyScalar(2.5);
            
            const centerPos = cameraPos.clone().add(forward);
            
            nijo.object3D.position.copy(centerPos);
            nijo.object3D.scale.set(0.5, 0.5, 0.5);
            nijo.object3D.rotation.set(0, 0, 0);

            if(nijo.components['drag-wrapper']) nijo.components['drag-wrapper'].reset();
            
            log("Position Reset");
        }

        function forceTransparent() {
            document.body.style.backgroundColor = 'transparent';
            document.querySelector('.a-canvas').style.backgroundColor = 'transparent';
        }

        AFRAME.registerComponent('photo-capture', {
            init: function() {
                this.captureRequested = false;
            },
            requestCapture: function() {
                this.captureRequested = true;
            },
            tock: function() {
                if (!this.captureRequested) return;
                this.captureRequested = false;

                const scene = this.el;
                const video = document.getElementById('arjs-video');
                const sceneCanvas = scene.renderer.domElement;
                const t = translations[currentLang];

                if (!video || !sceneCanvas) {
                    log("Video or Canvas not ready.");
                    return;
                }

                try {
                    const shutterBtn = document.getElementById('shutter-btn');
                    const originalBg = shutterBtn.style.background;
                    shutterBtn.style.background = "white";
                    setTimeout(() => { shutterBtn.style.background = originalBg; }, 100);

                    const destW = window.innerWidth * window.devicePixelRatio;
                    const destH = window.innerHeight * window.devicePixelRatio;

                    const combinedCanvas = document.createElement('canvas');
                    combinedCanvas.width = destW;
                    combinedCanvas.height = destH;
                    const ctx = combinedCanvas.getContext('2d');

                    const drawAspectFill = (image, context, dW, dH) => {
                        const imgW = image.width || image.videoWidth;
                        const imgH = image.height || image.videoHeight;
                        
                        const scale = Math.max(dW / imgW, dH / imgH);
                        const scaledW = imgW * scale;
                        const scaledH = imgH * scale;

                        const offsetX = (dW - scaledW) / 2;
                        const offsetY = (dH - scaledH) / 2;

                        context.drawImage(image, offsetX, offsetY, scaledW, scaledH);
                    };

                    drawAspectFill(video, ctx, destW, destH);
                    drawAspectFill(sceneCanvas, ctx, destW, destH);

                    const dataURL = combinedCanvas.toDataURL("image/jpeg", 0.9);
                    const link = document.createElement('a');
                    const timestamp = new Date().toISOString().slice(0,19).replace(/[-T:]/g,'');
                    link.download = `AR_Photo_${timestamp}.jpg`;
                    link.href = dataURL;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    log(t.photoSaved);
                } catch (e) {
                    log("Photo failed: " + e.message);
                    console.error(e);
                }
            }
        });

        AFRAME.registerComponent('drag-wrapper', {
            init: function () {
                this.isActive = false;
                this.mode = 'none';
                this.hitBoxMesh = null;
                this.camera = null;

                this.startFingerX = 0;
                this.startFingerY = 0;
                this.startObjPos = new THREE.Vector3();

                this.startDistance = 0;
                this.baseScale = new THREE.Vector3();
                this.startMidX = 0;
                this.startRotationY = 0;
                this.rotationSpeed = 0.01;
                this.moveSpeed = 0.003; 

                this.el.addEventListener('model-loaded', () => {
                    log("Model loaded. Preparing HitBox...");
                    setTimeout(() => this.createHitBox(), 500);
                });

                setTimeout(() => {
                    if (!this.hitBoxMesh && this.el.getObject3D('mesh')) this.createHitBox();
                }, 3000);

                this.createHitBox = () => {
                    if (this.hitBoxMesh) return;
                    const obj = this.el.object3D;
                    obj.updateMatrixWorld(true);

                    const box = new THREE.Box3().setFromObject(obj);
                    const size = new THREE.Vector3();
                    box.getSize(size);

                    if (box.isEmpty() || size.length() < 0.001) {
                        setTimeout(this.createHitBox, 1000);
                        return;
                    }

                    const geometry = new THREE.BoxGeometry(size.x * 1.3, size.y * 1.3, size.z * 1.3);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0xff0000, 
                        opacity: 0.0,
                        transparent: true,
                        visible: true,
                        depthTest: false
                    });
                    this.hitBoxMesh = new THREE.Mesh(geometry, material);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    const localCenter = obj.worldToLocal(center.clone());
                    this.hitBoxMesh.position.copy(localCenter);
                    this.el.object3D.add(this.hitBoxMesh);
                    log("HitBox Ready");
                };

                this.isTouchInsideBox = (touchX, touchY) => {
                    if (!this.hitBoxMesh || !this.camera) return false;
                    const mesh = this.hitBoxMesh;
                    mesh.updateMatrixWorld();
                    this.camera.updateMatrixWorld();

                    const geo = mesh.geometry;
                    const w = geo.parameters.width / 2;
                    const h = geo.parameters.height / 2;
                    const d = geo.parameters.depth / 2;

                    const corners = [
                        new THREE.Vector3( w,  h,  d), new THREE.Vector3( w,  h, -d),
                        new THREE.Vector3( w, -h,  d), new THREE.Vector3( w, -h, -d),
                        new THREE.Vector3(-w,  h,  d), new THREE.Vector3(-w,  h, -d),
                        new THREE.Vector3(-w, -h,  d), new THREE.Vector3(-w, -h, -d)
                    ];

                    let minX = Infinity, maxX = -Infinity;
                    let minY = Infinity, maxY = -Infinity;

                    corners.forEach(v => {
                        v.applyMatrix4(mesh.matrixWorld);
                        v.project(this.camera);
                        const px = (v.x * .5 + .5) * window.innerWidth;
                        const py = (-(v.y * .5) + .5) * window.innerHeight;
                        if (px < minX) minX = px; if (px > maxX) maxX = px;
                        if (py < minY) minY = py; if (py > maxY) maxY = py;
                    });

                    const padding = 30;
                    minX -= padding; maxX += padding;
                    minY -= padding; maxY += padding;

                    return (touchX >= minX && touchX <= maxX && touchY >= minY && touchY <= maxY);
                };

                this.reset = () => {
                    this.isActive = false;
                    this.mode = 'none';
                    if(this.hitBoxMesh) this.hitBoxMesh.material.opacity = 0.0;
                };

                window.addEventListener('touchstart', (e) => {
                    if (!window.isARStarted) return;

                    // 【修正点】: タッチ対象がボタン(またはその内部要素)の場合は、オブジェクト操作を行わない
                    if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                        return;
                    }

                    if (!this.camera) this.camera = this.el.sceneEl.camera;
                    if (!this.hitBoxMesh) return;

                    const touch = e.touches[0];
                    if (this.isTouchInsideBox(touch.clientX, touch.clientY)) {
                        if (e.cancelable) e.preventDefault();
                        this.isActive = true;
                        this.hitBoxMesh.material.opacity = 0.3;
                        
                        log(translations[currentLang].grabbed);

                        if (e.touches.length === 1) {
                            this.mode = 'move';
                            this.startFingerX = touch.clientX;
                            this.startFingerY = touch.clientY;
                            this.startObjPos.copy(this.el.object3D.position);
                        } else if (e.touches.length === 2) {
                            this.mode = 'scale_rotate';
                            this.startDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                            this.baseScale.copy(this.el.object3D.scale);
                            this.startMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                            this.startRotationY = this.el.object3D.rotation.y;
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (!this.isActive) return;
                    if (e.cancelable) e.preventDefault();
                    
                    const touches = e.touches;

                    if (touches.length === 2) {
                        const currentDist = Math.hypot(touches[0].pageX - touches[1].pageX, touches[0].pageY - touches[1].pageY);
                        const currentMidX = (touches[0].clientX + touches[1].clientX) / 2;

                        if (this.mode !== 'scale_rotate') {
                            this.mode = 'scale_rotate';
                            this.startDistance = currentDist;
                            this.baseScale.copy(this.el.object3D.scale);
                            this.startMidX = currentMidX;
                            this.startRotationY = this.el.object3D.rotation.y;
                            return; 
                        }

                        if (this.startDistance > 0) {
                            const ratio = currentDist / this.startDistance;
                            let newScale = this.baseScale.x * ratio;
                            if (newScale < 0.1) newScale = 0.1;
                            if (newScale > 5.0) newScale = 5.0;
                            this.el.object3D.scale.set(newScale, newScale, newScale);
                        }

                        const deltaX = currentMidX - this.startMidX;
                        this.el.object3D.rotation.y = this.startRotationY + (deltaX * this.rotationSpeed);
                    }
                    else if (touches.length === 1) {
                        if (this.mode !== 'move') {
                            this.mode = 'move';
                            this.startFingerX = touches[0].clientX;
                            this.startFingerY = touches[0].clientY;
                            this.startObjPos.copy(this.el.object3D.position);
                            return;
                        }
                        const t = touches[0];
                        const dx = t.clientX - this.startFingerX;
                        const dy = t.clientY - this.startFingerY;
                        this.el.object3D.position.x = this.startObjPos.x + (dx * this.moveSpeed);
                        this.el.object3D.position.y = this.startObjPos.y - (dy * this.moveSpeed);
                    }
                }, { passive: false });

                const endAction = (e) => {
                    if (!this.isActive) return;
                    if (e.touches.length === 0) {
                        this.isActive = false;
                        this.mode = 'none';
                        if(this.hitBoxMesh) this.hitBoxMesh.material.opacity = 0.0;
                    }
                };
                window.addEventListener('touchend', endAction);
                window.addEventListener('touchcancel', endAction);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('ja');
        });

    </script>
</head>

<body>
    <div id="launcher">
        <div id="lang-container">
            <button id="btn-ja" class="lang-btn active" onclick="setLanguage('ja')">日本語</button>
            <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">English</button>
            <button id="btn-zh" class="lang-btn" onclick="setLanguage('zh')">中文</button>
            <button id="btn-ko" class="lang-btn" onclick="setLanguage('ko')">한국어</button>
        </div>

        <button id="launch-btn" onclick="startCamera()">START CAMERA</button>
    </div>
    
    <button id="reset-btn" onclick="resetPositions()">RESET</button>
    <button id="fix-bg-btn" onclick="forceTransparent()">Fix BG</button>
    <button id="shutter-btn" onclick="takePhoto()">TAKE PHOTO</button>

    <div id="status-text">Initializing...</div>

    <a-scene embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true; alpha: true; preserveDrawingBuffer: true;"
        vr-mode-ui="enabled: false"
        photo-capture>

        <a-entity camera position="0 1.6 0"></a-entity>
        <a-entity light="type: ambient; intensity: 1.0; color: #fff;"></a-entity>
        <a-entity light="type: directional; intensity: 1.0; position: 1 2 1;"></a-entity>

        <a-entity id="wrapper-nijo" position="0.0 1.6 -3.0" drag-wrapper>
            <a-entity gltf-model="url(min_nijo.glb)" scale="0.5 0.5 0.5" position="0 -0.5 0"></a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
