<!DOCTYPE html>
<html>
<head>
    <title>AR Exact Mesh Touch</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: transparent !important;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .a-canvas {
            background-color: transparent !important;
            display: block !important;
            z-index: 10 !important;
        }
        #arjs-video {
            z-index: 1 !important; position: fixed !important;
            top: 0; left: 0; width: 100%; height: 100%;
            display: block !important; object-fit: cover !important;
        }
        /* UI類 */
        #launcher {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #launch-btn {
            padding: 20px 50px; font-size: 20px; font-weight: bold; color: white;
            background: #00C853; border: none; border-radius: 50px; cursor: pointer;
        }
        #reset-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 99999; padding: 15px 50px; background: rgba(0, 122, 255, 0.9);
            color: white; border: 2px solid white; border-radius: 40px;
            font-size: 18px; font-weight: bold; cursor: pointer; display: none;
        }
        #fix-bg-btn {
            position: fixed; bottom: 40px; right: 20px; z-index: 99999;
            padding: 10px; background: rgba(0,0,0,0.5); color: #ccc;
            border: 1px solid #888; border-radius: 8px; font-size: 12px; display: none;
        }
        #status-text {
            position: fixed; top: 30px; width: 100%; text-align: center;
            color: yellow; font-weight: bold; font-size: 22px;
            text-shadow: 2px 2px 4px black; pointer-events: none; z-index: 9000;
        }
    </style>

    <script>
        // カメラ起動
        function startCamera() {
            document.getElementById('launch-btn').innerText = "Starting...";
            setTimeout(() => {
                document.getElementById('launcher').style.display = 'none';
                document.getElementById('reset-btn').style.display = 'block';
                document.getElementById('fix-bg-btn').style.display = 'block';
                document.querySelector('a-scene').play();
                setTimeout(resetPositions, 1000);
            }, 500);
        }

        // リセット処理
        function resetPositions() {
            const camera = document.querySelector('[camera]');
            const acorn = document.getElementById('wrapper-acorn');
            const pain = document.getElementById('wrapper-pain');
            
            // カメラ前方に再配置
            const cameraPos = camera.object3D.position;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.object3D.quaternion).multiplyScalar(2.5);
            const centerPos = cameraPos.clone().add(forward);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.object3D.quaternion);
            
            const offset = 0.4;
            acorn.object3D.position.copy(centerPos.clone().add(right.clone().multiplyScalar(-offset)));
            pain.object3D.position.copy(centerPos.clone().add(right.clone().multiplyScalar(offset)));

            // スケール・回転リセット
            acorn.object3D.scale.set(1, 1, 1);
            pain.object3D.scale.set(1, 1, 1);
            acorn.object3D.rotation.set(0, 0, 0); 
            pain.object3D.rotation.set(0, 0, 0);

            if(acorn.components['drag-wrapper']) acorn.components['drag-wrapper'].reset();
            if(pain.components['drag-wrapper']) pain.components['drag-wrapper'].reset();
        }

        function forceTransparent() {
            document.body.style.backgroundColor = 'transparent';
            document.querySelector('.a-canvas').style.backgroundColor = 'transparent';
        }

        // --- 強力版ドラッグ＆回転コンポーネント ---
        AFRAME.registerComponent('drag-wrapper', {
            init: function () {
                this.isActive = false;
                this.mode = 'none'; // 'move' or 'scale_rotate'
                
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.camera = null;

                this.startDistance = 0;
                this.baseScale = new THREE.Vector3();
                this.startMidX = 0;
                this.startRotationY = 0;
                this.rotationSpeed = 0.01;

                const isPortrait = window.innerHeight > window.innerWidth;
                this.xFactor = isPortrait ? 2.5 : 4.0; 
                this.yFactor = isPortrait ? 4.0 : 3.0;
                this.fingerOffsetY = 0.8; 

                const getDistance = (t1, t2) => {
                    const dx = t1.pageX - t2.pageX;
                    const dy = t1.pageY - t2.pageY;
                    return Math.sqrt(dx * dx + dy * dy);
                };

                const getMidX = (t1, t2) => {
                    return (t1.clientX + t2.clientX) / 2;
                };

                const moveToFinger = (cx, cy) => {
                    const sx = (cx / window.innerWidth) * 2 - 1;
                    const sy = -(cy / window.innerHeight) * 2 + 1;
                    this.el.object3D.position.x = sx * this.xFactor;
                    this.el.object3D.position.y = (sy * this.yFactor) + 1.6 + this.fingerOffsetY;
                };

                this.reset = () => {
                    this.isActive = false;
                    this.mode = 'none';
                };

                // --- 1. タッチ開始 ---
                window.addEventListener('touchstart', (e) => {
                    if (!this.camera) {
                        this.camera = this.el.sceneEl.camera;
                        if (!this.camera) return;
                    }

                    const touch = e.touches[0];
                    this.mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

                    // 【重要修正】座標行列を最新の状態に強制更新
                    // これを行わないと、見た目と内部判定の位置がズレることがあります
                    this.camera.updateMatrixWorld(); 
                    this.el.object3D.updateMatrixWorld(true);

                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    
                    // 【重要修正】Mesh(網目)のみを厳密に抽出して判定対象にする
                    // グループ(空の箱)ではなく、実際のポリゴンデータに対して判定を行います
                    let meshes = [];
                    this.el.object3D.traverse((node) => {
                        if (node.isMesh) {
                            meshes.push(node);
                        }
                    });

                    // 抽出したメッシュに対して判定
                    const intersects = this.raycaster.intersectObjects(meshes, true);

                    if (intersects.length > 0) {
                        if (e.cancelable) e.preventDefault();
                        this.isActive = true;

                        // タッチされたことを視覚的に少しフィードバック（任意）
                        // console.log("Touched Object:", this.el.id);

                        if (e.touches.length === 1) {
                            this.mode = 'move';
                            moveToFinger(touch.clientX, touch.clientY);
                        }
                        else if (e.touches.length === 2) {
                            this.mode = 'scale_rotate';
                            this.startDistance = getDistance(e.touches[0], e.touches[1]);
                            this.baseScale.copy(this.el.object3D.scale);
                            this.startMidX = getMidX(e.touches[0], e.touches[1]);
                            this.startRotationY = this.el.object3D.rotation.y;
                        }
                    }
                }, { passive: false });

                // --- 2. タッチ移動 ---
                window.addEventListener('touchmove', (e) => {
                    if (!this.isActive) return;
                    if (e.cancelable) e.preventDefault();

                    const touches = e.touches;

                    if (touches.length === 2) {
                        const currentDist = getDistance(touches[0], touches[1]);
                        const currentMidX = getMidX(touches[0], touches[1]);

                        if (this.mode !== 'scale_rotate') {
                            this.mode = 'scale_rotate';
                            this.startDistance = currentDist;
                            this.baseScale.copy(this.el.object3D.scale);
                            this.startMidX = currentMidX;
                            this.startRotationY = this.el.object3D.rotation.y;
                            return; 
                        }

                        // A. スケール
                        if (this.startDistance > 0) {
                            const ratio = currentDist / this.startDistance;
                            let newScale = this.baseScale.x * ratio;
                            if (newScale < 0.1) newScale = 0.1;
                            if (newScale > 5.0) newScale = 5.0;
                            this.el.object3D.scale.set(newScale, newScale, newScale);
                        }

                        // B. 回転（横移動）
                        const deltaX = currentMidX - this.startMidX;
                        this.el.object3D.rotation.y = this.startRotationY + (deltaX * this.rotationSpeed);
                    }
                    else if (touches.length === 1) {
                        this.mode = 'move';
                        const t = touches[0];
                        moveToFinger(t.clientX, t.clientY);
                    }
                }, { passive: false });

                // --- 3. タッチ終了 ---
                const endAction = (e) => {
                    if (!this.isActive) return;
                    if (e.touches.length === 0) {
                        this.isActive = false;
                        this.mode = 'none';
                    }
                };

                window.addEventListener('touchend', endAction);
                window.addEventListener('touchcancel', endAction);
            }
        });

        // --- 形状に合わせた衝突判定 (AABB) ---
        AFRAME.registerComponent('collision-check', {
            init: function () {
                this.box1 = new THREE.Box3();
                this.box2 = new THREE.Box3();
            },
            tick: function () {
                const w1 = document.querySelector('#wrapper-acorn');
                const w2 = document.querySelector('#wrapper-pain');
                // モデルがロードされているか確認（メッシュが存在するか）
                // まだロードされていない場合は処理をスキップ
                if (!w1 || !w2) return;
                
                // バウンディングボックス計算
                // updateMatrixWorldをここでも呼ぶことで正確性を向上
                w1.object3D.updateMatrixWorld(true);
                w2.object3D.updateMatrixWorld(true);

                this.box1.setFromObject(w1.object3D);
                this.box2.setFromObject(w2.object3D);

                // 空のボックス（モデル未ロード時など）の場合は判定しない
                if (this.box1.isEmpty() || this.box2.isEmpty()) return;

                const isHit = this.box1.intersectsBox(this.box2);

                if (isHit) { 
                    document.getElementById('status-text').innerText = "HIT !!";
                    document.getElementById('status-text').style.color = "#FF3333";
                    const modelEntity = w2.querySelector('a-entity[gltf-model]');
                    if(modelEntity) {
                        modelEntity.object3D.rotation.z = Math.sin(Date.now() / 50) * 0.3;
                    }
                } else {
                    document.getElementById('status-text').innerText = "1 Finger: Move / 2 Fingers: Scale & Rotate";
                    document.getElementById('status-text').style.color = "yellow";
                    const modelEntity = w2.querySelector('a-entity[gltf-model]');
                    if(modelEntity) {
                        modelEntity.object3D.rotation.z = 0;
                    }
                }
            }
        });
    </script>
</head>

<body>
    <div id="launcher"><button id="launch-btn" onclick="startCamera()">START CAMERA</button></div>
    <button id="reset-btn" onclick="resetPositions()">RESET POSITION</button>
    <button id="fix-bg-btn" onclick="forceTransparent()">Fix BG</button>
    <div id="status-text">Waiting...</div>

    <a-scene embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true; alpha: true;"
        vr-mode-ui="enabled: false"
        collision-check>

        <a-entity camera position="0 1.6 0"></a-entity>
        <a-entity light="type: ambient; intensity: 1.0; color: #fff;"></a-entity>
        <a-entity light="type: directional; intensity: 1.0; position: 1 2 1;"></a-entity>

        <a-entity id="wrapper-acorn" position="-0.4 1.6 -3.0" drag-wrapper>
            <a-entity gltf-model="url(acorn.glb)" scale="12 12 12" position="0 -0.5 0"></a-entity>
        </a-entity>

        <a-entity id="wrapper-pain" position="0.4 1.6 -3.0" drag-wrapper>
            <a-entity gltf-model="url(pain.glb)" scale="0.012 0.012 0.012" position="0 -0.5 0"></a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
